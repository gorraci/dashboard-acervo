
            <!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Qualidade SP - Claro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        claro: { 500: '#da291c', 600: '#b51f14', 700: '#91170f' } // Vermelho Oficial Claro
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

    <!-- HEADER / NAVBAR (Com identidade Claro SP) -->
    <header class="bg-white dark:bg-slate-900 shadow-md sticky top-0 z-40 border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-claro-500 text-white p-2.5 rounded-xl shadow-md">
                    <i class="fa-solid fa-square-check text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight tracking-wide">Controle de Qualidade SP</h1>
                    <p class="text-xs text-claro-500 font-semibold uppercase tracking-wider">Claro Brasil</p>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <!-- Botão Dark Mode -->
                <button onclick="toggleDarkMode()" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 transition">
                    <i id="theme-icon" class="fa-solid fa-sun"></i>
                </button>

                <!-- Botão Painel Admin -->
                <button onclick="openAdminModal()" class="bg-claro-500 hover:bg-claro-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-plus-circle"></i> Adicionar / Gerenciar
                </button>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        
        <!-- BARRA DE PESQUISA E FILTROS -->
        <div class="flex flex-col md:flex-row gap-4 mb-8 justify-between items-center">
            <div class="relative w-full md:w-96">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="search-input" onkeyup="filterContent()" placeholder="Pesquisar relatórios, processos..." 
                    class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-800 bg-white dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-claro-500 text-sm">
            </div>

            <!-- Filtros por Categoria -->
            <div class="flex gap-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0" id="category-filters">
                <!-- Preenchido via JS -->
            </div>
        </div>

        <!-- GRID DE CONTEÚDOS -->
        <div id="content-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards injetados via JS -->
        </div>

    </main>

    <!-- MODAL DE ADMINISTRAÇÃO / CADASTRO -->
    <div id="admin-modal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl max-w-2xl w-full p-6 relative border border-slate-200 dark:border-slate-800 max-h-[90vh] overflow-y-auto">
            <button onclick="closeAdminModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            
            <h3 class="text-xl font-bold mb-1">Painel de Controle de Qualidade</h3>
            <p class="text-xs text-slate-500 dark:text-slate-400 mb-6">Cadastre novos arquivos ou links do OneDrive para alimentar o sistema.</p>

            <!-- Formulário para Adicionar Novo Item -->
            <form onsubmit="addNewItem(event)" class="space-y-4 bg-slate-50 dark:bg-slate-950 p-4 rounded-xl border border-slate-200 dark:border-slate-800 mb-6">
                <h4 class="font-semibold text-sm text-claro-500"><i class="fa-solid fa-file-arrow-up mr-1"></i> Novo Arquivo / Processo</h4>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider mb-1 text-slate-500">Título</label>
                        <input type="text" id="new-title" required placeholder="Ex: Indicadores SP - Março" class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-800 bg-white dark:bg-slate-900 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider mb-1 text-slate-500">Categoria (Pasta)</label>
                        <input type="text" id="new-category" required placeholder="Ex: Auditorias, Relatórios, Processos" class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-800 bg-white dark:bg-slate-900 text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider mb-1 text-slate-500">Link do OneDrive / Destino</label>
                    <input type="url" id="new-link" required placeholder="https://onedrive.live.com/..." class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-800 bg-white dark:bg-slate-900 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider mb-1 text-slate-500">Descrição</label>
                    <input type="text" id="new-desc" placeholder="Detalhes rápidos..." class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-800 bg-white dark:bg-slate-900 text-sm">
                </div>

                <button type="submit" class="w-full bg-claro-500 hover:bg-claro-600 text-white font-medium py-2 rounded-lg text-sm shadow transition">
                    Salvar no Painel
                </button>
            </form>

            <!-- Lista de Itens Cadastrados para Gerenciar -->
            <h4 class="font-semibold text-sm mb-3">Itens Cadastrados</h4>
            <div id="admin-items-list" class="space-y-2 max-h-48 overflow-y-auto pr-2">
                <!-- Preenchido via JS -->
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500 dark:text-slate-400">
        <p>&copy; 2026 Controle de Qualidade SP - Claro Brasil. Todos os direitos reservados.</p>
    </footer>

    <!-- SCRIPT DA APLICAÇÃO -->
    <script>
        const defaultItems = [
            { id: 1, title: 'Procedimento Operacional Padrão (POP)', category: 'Manuais', description: 'Diretrizes de qualidade para atendimento e processos SP.', link: 'https://onedrive.live.com', date: '03/09/2026' },
            { id: 2, title: 'Planilha de Auditoria e Métricas', category: 'Relatórios', description: 'Acompanhamento diário de indicadores de qualidade.', link: 'https://onedrive.live.com', date: '03/09/2026' }
        ];

        let items = JSON.parse(localStorage.getItem('claro_qualidade_items')) || defaultItems;

        window.addEventListener('DOMContentLoaded', () => {
            renderContent(items);
            renderCategories();
        });

        function renderContent(data) {
            const grid = document.getElementById('content-grid');
            grid.innerHTML = '';

            if (data.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">Nenhum arquivo cadastrado. Clique em "Adicionar / Gerenciar" no topo.</div>`;
                return;
            }

            data.forEach(item => {
                grid.innerHTML += `
                    <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 shadow-sm hover:shadow-md transition flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-3">
                                <span class="bg-claro-500/10 text-claro-500 text-xs px-2.5 py-1 rounded-full font-bold">${item.category}</span>
                                <span class="text-[10px] text-slate-400">${item.date || ''}</span>
                            </div>
                            <h3 class="font-bold text-base mb-1 text-slate-800 dark:text-slate-100">${item.title}</h3>
                            <p class="text-xs text-slate-500 dark:text-slate-400 mb-4">${item.description || 'Sem descrição.'}</p>
                        </div>
                        <a href="${item.link}" target="_blank" class="w-full flex items-center justify-center gap-2 bg-claro-500 hover:bg-claro-600 text-white font-medium py-2 rounded-xl text-xs transition shadow-sm">
                            <i class="fa-solid fa-download"></i> Acessar Arquivo
                        </a>
                    </div>
                `;
            });
        }

        function renderCategories() {
            const container = document.getElementById('category-filters');
            const categories = ['Todos', ...new Set(items.map(i => i.category))];
            
            container.innerHTML = '';
            categories.forEach((cat, index) => {
                const isActive = index === 0;
                container.innerHTML += `
                    <button onclick="filterCategory('${cat}', this)" class="cat-btn px-4 py-2 rounded-xl text-sm font-medium ${isActive ? 'bg-claro-500 text-white shadow-sm' : 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800'} whitespace-nowrap transition">${cat}</button>
                `;
            });
        }

        function filterCategory(category, btnElement) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = 'cat-btn px-4 py-2 rounded-xl text-sm font-medium bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800 whitespace-nowrap transition';
            });
            btnElement.className = 'cat-btn px-4 py-2 rounded-xl text-sm font-medium bg-claro-500 text-white shadow-sm whitespace-nowrap transition';

            if (category === 'Todos') {
                renderContent(items);
            } else {
                renderContent(items.filter(i => i.category === category));
            }
        }

        function filterContent() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = items.filter(i => i.title.toLowerCase().includes(query) || i.description.toLowerCase().includes(query) || i.category.toLowerCase().includes(query));
            renderContent(filtered);
        }

        function addNewItem(e) {
            e.preventDefault();
            const title = document.getElementById('new-title').value;
            const category = document.getElementById('new-category').value;
            const link = document.getElementById('new-link').value;
            const description = document.getElementById('new-desc').value;
            const today = new Date().toLocaleDateString('pt-BR');

            const newItem = { id: Date.now(), title, category, link, description, date: today };
            items.push(newItem);
            localStorage.setItem('claro_qualidade_items', JSON.stringify(items));

            e.target.reset();
            renderContent(items);
            renderCategories();
            renderAdminList();
            alert('Item adicionado com sucesso ao Controle de Qualidade SP!');
        }

        function deleteItem(id) {
            if (confirm('Deseja realmente remover este arquivo?')) {
                items = items.filter(i => i.id !== id);
                localStorage.setItem('claro_qualidade_items', JSON.stringify(items));
                renderContent(items);
                renderCategories();
                renderAdminList();
            }
        }

        function renderAdminList() {
            const listContainer = document.getElementById('admin-items-list');
            listContainer.innerHTML = '';

            if (items.length === 0) {
                listContainer.innerHTML = `<p class="text-xs text-slate-400">Nenhum item cadastrado.</p>`;
                return;
            }

            items.forEach(item => {
                listContainer.innerHTML += `
                    <div class="flex justify-between items-center bg-white dark:bg-slate-900 p-2.5 rounded-lg border border-slate-200 dark:border-slate-800 text-xs">
                        <div>
                            <span class="font-bold text-slate-700 dark:text-slate-200">${item.title}</span>
                            <span class="ml-2 text-[10px] bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded text-slate-500">${item.category}</span>
                        </div>
                        <button onclick="deleteItem(${item.id})" class="text-red-500 hover:text-red-700 px-2 py-1 transition">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
            });
        }

        function openAdminModal() {
            renderAdminList();
            document.getElementById('admin-modal').classList.remove('hidden');
        }
        function closeAdminModal() {
            document.getElementById('admin-modal').classList.add('hidden');
        }
        function toggleDarkMode() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.className = 'fa-solid fa-moon';
            } else {
                html.classList.add('dark');
                icon.className = 'fa-solid fa-sun';
            }
        }
    </script>
</body>
</html>
